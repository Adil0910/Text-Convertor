    <div class="butgroup">
    <button class="but1" type="submit"onclick="call1()">UPPER CASE</button><button class="but2" type="submit"onclick="call2()">lowercase</button>
    <button class="but3" type="submit" onclick="call3()">Sentence case</button><button class="but4" type="submit"onclick="call4()">Title Case</button><button class="but5" type="submit" onclick="call5()">aLtErNaTing cAsE</button><button class="but6" type="submit"onclick="call6()">InVeRsE CaSe</button>
</div>
 <div class="butgroup2">
    <button class="butt1" type="submit"onclick="call7()">camelCase</button><button class="butt2" type="submit"onclick="call8()">PascalCase</button><button class="butt3" type="submit" onclick="call9()">Snake_case</button><button class="butt4"type="submit" onclick="call10()">kebab-case</button><button class="butt5" type="submit" onclick="call11()">Reverse Text</button><button class="butt6" type="submit" onclick="call12()">InVeRsE CaSe</button>
</div>
 <div class="butgroup3">
<button class="butta4" type="submit" onclick="call15()"><i class="fa-solid fa-download"></i> Download</button>
    <button class="butta1" type="submit" onclick="call12()">Remove Space</button><button class="butta2" type="submit" onclick="call13()"><i class="fa-regular fa-copy"></i> Copy</button><button class="butta3" type="submit" onclick="call14()"><i class="fa-solid fa-rotate-left"></i> Clear</button>
</div>
<div class="boxlengthh">
<div id="length">0 characters</div>
<div id="length2">0 words</div>
<div id="length3">0 sentences</div>
<div id="length4">1 lines</div>
</div>

    <script>
function len() {
    let txt = document.getElementById("convertor").value;

    // Characters
    document.getElementById("length").innerText = txt.length + " characters";

    // Words
    let words = txt.trim().split(/\s+/).filter(Boolean); // Empty space ignore
    document.getElementById("length2").innerText = words.length + " words";

    // Sentences (., !, ? se count)
    let sentences = (txt.match(/[.!?]+/g) || []).length;
    document.getElementById("length3").innerText = sentences + " sentences";

    // Lines
    let lines = txt.split(/\n/).length;
    document.getElementById("length4").innerText = lines + " lines";
}


// Helper functions
function getText() {
  return document.getElementById("convertor").value;
}

function setText(val) {
  document.getElementById("convertor").value = val;
}

// UPPER CASE
function call1() {
  setText(getText().toUpperCase());
}

// lowercase
function call2() {
  setText(getText().toLowerCase());
}

// Sentence case
function call3() {
  let txt = getText().toLowerCase();
  setText(txt.charAt(0).toUpperCase() + txt.slice(1));
}

// Title Case
function call4() {
  let txt = getText().toLowerCase()
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join(" ");
  setText(txt);
}

// aLtErNaTiNg CaSe
function call5() {
  let txt = getText().split("")
    .map((ch, i) => i % 2 === 0 ? ch.toLowerCase() : ch.toUpperCase())
    .join("");
  setText(txt);
}

// InVeRsE CaSe
function call6() {
  let txt = getText().split("")
    .map(ch => ch === ch.toUpperCase() ? ch.toLowerCase() : ch.toUpperCase())
    .join("");
  setText(txt);
}

// camelCase
function call7() {
  let txt = getText().toLowerCase()
    .split(" ")
    .map((word, i) => i === 0 ? word : word.charAt(0).toUpperCase() + word.slice(1))
    .join("");
  setText(txt);
}

// PascalCase
function call8() {
  let txt = getText().toLowerCase()
    .split(" ")
    .map(word => word.charAt(0).toUpperCase() + word.slice(1))
    .join("");
  setText(txt);
}

// Snake_case
function call9() {
  setText(getText().toLowerCase().replace(/\s+/g, "_"));
}

// kebab-case
function call10() {
  setText(getText().toLowerCase().replace(/\s+/g, "-"));
}

// Reverse Text
function call11() {
  setText(getText().split("").reverse().join(""));
}
// Remove Space
function call12() {
  setText(getText().replace(/\s+/g, ""));
}

// Copy text
function call13() {
  navigator.clipboard.writeText(getText());
//   alert("Copied!");
}

// Clear text
function call14() {
  setText("");
}
// Download text
function call15() {
  let text = getText();
  let blob = new Blob([text], { type: "text/plain" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "converted_text.txt";
  link.click();
}
